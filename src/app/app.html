<header class="site-header">
  <nav class="container" aria-label="Main">
    <a class="brand" routerLink="/">
      <span class="mark" aria-hidden="true">V</span>
      Vetle
    </a>
    <ul>
      <li>
        <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Home</a>
      </li>
      <li><a routerLink="/projects" routerLinkActive="active">Projects</a></li>
    </ul>
  </nav>
</header>

<main class="container">
  <router-outlet />
</main>

<footer class="site-footer">
  <div class="container">
    <small>© {{ year }} Vetle · Built with Angular, ASP.NET Core &amp; MongoDB</small>
    <a href="https://github.com/HomandoBruther" target="_blank" rel="noopener">GitHub</a>
  </div>
</footer>
